seeds:
  ica: 42
  cv_split: 1337
  bootstrap: 2718
  permutation: 31415
  subsample: 8128

paths:
  raw: data/raw
  derived: data/derived
  outputs: outputs

eeg:
  sfreq_target: 250
  epoch_length_s: 5.0
  epoch_overlap: 0.0
  reference: average
  ecg_channel: ECG1         # 不是 EEG，务必排除。本版本叫 ECG1，不是 TP9，见 deviations.md
  channels:                  # 复现基线用的 10 通道，顺序固定
    - F3
    - Fz
    - F4
    - FCz
    - C3
    - C4
    - CPz
    - P3
    - Pz
    - P4

bands:
  theta: [4.0, 8.0]
  alpha: [8.0, 12.0]        # 注意是 12 不是 13，见 pitfalls.md #6

cleaning:
  # 见 deviations.md 2026-07-30「坏道阈值」条目与 outputs/logs/G0.3_*。
  # 「2 SD」与发表的 ~0.34 通道/task 在任何 z 阈值口径下都不可能同时成立：
  # 62 通道上 |z|>2 天然就是 ~5% ≈ 3 个。阈值改为对着发表率标定。
  bad_channel_statistic: kurtosis   # log_variance | kurtosis
  bad_channel_sd: 5.0
  iclabel_threshold: 0.90
  iclabel_reject: [eye, muscle, heart]
  epoch_rejection: false     # ML 管线关闭，见 pitfalls.md #1

decode:
  classifier: mdm
  n_folds: 5
  n_classes: 3
  chance_ceiling: 0.417

bootstrap:
  n_draws: 2000

permutation:
  n_runs: 200
